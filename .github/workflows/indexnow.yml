name: IndexNow ping
# Tells Bing, Yandex, Naver, Seznam (and other IndexNow engines) about every page in sitemap.xml
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages to publish
        run: sleep 120
      - name: Submit sitemap URLs to IndexNow
        run: |
          KEY=ce376664799a444c8ba2201a05a19d59
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          BODY=$(printf '{"host":"greenlightpermits.github.io","key":"%s","keyLocation":"https://greenlightpermits.github.io/%s.txt","urlList":%s}' "$KEY" "$KEY" "$URLS")
          echo "$BODY"
          curl -sS -w "\nHTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" -d "$BODY"
