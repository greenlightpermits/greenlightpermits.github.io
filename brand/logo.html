<!DOCTYPE html><html><head><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent}
.sq{width:720px;height:720px;background:#13201a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;position:relative;overflow:hidden}
.sq:after{content:"";position:absolute;right:-160px;top:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(18,161,80,.35),transparent 70%)}
.light{position:relative;z-index:1;display:flex;flex-direction:column;gap:22px;background:#0b140f;border:6px solid #2a3a32;padding:30px 30px;border-radius:52px}
.light i{display:block;width:104px;height:104px;border-radius:50%;background:#33433b}
.light i.on{background:#12a150;box-shadow:0 0 60px 12px rgba(18,161,80,.75)}
.word{position:relative;z-index:1;font-family:Archivo,Inter,Arial,sans-serif;font-weight:800;color:#fff;font-size:76px;letter-spacing:-1px;line-height:1}
.sub{position:relative;z-index:1;font-family:Archivo,Arial,sans-serif;font-weight:800;color:#5fd98f;font-size:26px;letter-spacing:5px;margin-top:-18px}
</style></head><body>
<div class="sq" id="logo"><div class="light"><i></i><i></i><i class="on"></i></div><div class="word">Greenlight</div><div class="sub">PERMITS &amp; TAKEOFFS</div></div>
</body></html>
